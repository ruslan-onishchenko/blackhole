user  angie;
worker_processes  auto;

error_log  /var/log/angie/error.log warn;
pid        /var/run/angie.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/angie/mime.types;
    default_type   application/octet-stream;

    access_log  /var/log/angie/access.log;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout  65;
    server_tokens off;

    gzip  on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # --- HTTP: ACME-челленджи + редирект на HTTPS ---
    server {
        listen 80;
        server_name <домен>;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --- HTTPS: раздача статики ---
    server {
        listen 443 ssl;
        server_name <домен>;

        ssl_certificate     /etc/letsencrypt/live/<домен>/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/<домен>/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        root  /usr/share/angie/html;
        index index.html;

        # index.html — без кэша, обновления подхватываются сразу
        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        # хэшированные файлы Vite — кэш на год
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # прочая статика (шрифты, шейдеры) — сутки
        location ~* \.(woff2?|vert|frag|json|png|jpg|svg|ico)$ {
            add_header Cache-Control "public, max-age=86400";
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
