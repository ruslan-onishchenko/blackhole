services:
  blackhole:
    build: .
    image: blackhole:latest
    command: >-
      /bin/sh -c
      "while :; do sleep 6h & wait $${!}; angie -s reload; done &
      exec angie -g 'daemon off;'"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-q", "-O", "/dev/null", "https://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3

  certbot:
    image: certbot/certbot:v5.8.0
    entrypoint: >-
      /bin/sh -c
      "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    depends_on:
      - blackhole
    restart: unless-stopped

volumes:
  certbot-etc:
  certbot-www:
